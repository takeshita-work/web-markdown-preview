name: Pages

# main への push で GitHub Pages を更新する。
# 描画はすべてクライアント側なので静的ホスティングで動く（File System Access API は https なら可）。
# 公開ビルドは __HOSTED__ = true とし、ローカルサーバ前提の機能（ポート設定 / アプリ終了）を出さない。
# ※ リポジトリの Settings → Pages → Source を「GitHub Actions」にしておくこと。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は 1 本ずつ。実行中のデプロイはキャンセルしない
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install # package-lock は未コミットのため npm ci ではなく install

      - name: Build client bundle
        run: node scripts/build-web.mjs # → public/bundle.js（__HOSTED__ = true）

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public # index.html / app.css / bundle.js / favicon.svg

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
